# Namorix Thread — dashboard backend (sau có thể thêm frontend).
# Từ thư mục dashboard/: docker compose up --build
#
# Backend: WebSocket/HTTP :3000, CoAP UDP :5683
# network_mode: host — dùng chung stack mạng với host (route prefix Thread qua BR có hiệu lực).

services:
  backend:
    container_name: namorix-thread-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    network_mode: host
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Repo `namorix-thread/data` — dùng chung DB (config BR, node) với lúc chạy local
      - ../data:/app/data
    restart: unless-stopped
