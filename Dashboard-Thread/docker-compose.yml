# Dashboard-Thread — backend (sau có thể thêm frontend).
# Từ thư mục Dashboard-Thread: docker compose up --build
#
# Backend: WebSocket/HTTP :3000, CoAP UDP :5683
# network_mode: host — dùng chung stack mạng với host (route prefix Thread qua BR có hiệu lực).

services:
  backend:
    container_name: dashboard-thread-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    network_mode: host
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Bind thư mục backend/data trên host — dùng chung DB (config BR, node) với lúc chạy local
      - ./backend/data:/app/data
    restart: unless-stopped
