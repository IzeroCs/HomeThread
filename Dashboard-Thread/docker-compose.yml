# Dashboard-Thread — backend + OTBR (tùy chọn).
# Từ thư mục Dashboard-Thread: docker compose up --build
#
# Backend: chạy trên host (npm run dev:backend). Kết nối OTBR qua REST API (OTBR_REST_URL, mặc định http://127.0.0.1:8081).
# OTBR: entrypoint đợi RCP (by-id) rồi start; cần build với OTBR_REST=ON và listen 0.0.0.0:8081 để backend gọi REST.

services:
  otbr:
    container_name: dashboard-thread-otbr
    build:
      context: ./otbr
      dockerfile: Dockerfile
    image: dashboard-thread-otbr
    network_mode: host
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - 'c 166:* rwm'
      - 'c 188:* rwm'
    volumes:
      - /dev:/dev
      - otbr-data:/var/lib/otbr
    environment:
      - OT_RCP_DEVICE=spinel+hdlc+uart:///dev/serial/by-id/usb-1a86_USB_Single_Serial_579B026391-if00?uart-baudrate=460800
      - OT_INFRA_IF=enp8s0
      - OT_THREAD_IF=wpan0
      - OT_LOG_LEVEL=7
    restart: unless-stopped

volumes:
  otbr-data:
