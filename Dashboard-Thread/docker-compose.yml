# Dashboard-Thread — backend + OTBR (tùy chọn).
# Từ thư mục Dashboard-Thread: docker compose up --build
#
# Backend: chạy trên host (npm run dev:backend). OTBR container dùng D-Bus của host (mount socket)
# để backend trên host thấy otbr-agent — dev không cần build/chạy backend trong Docker.
# OTBR: entrypoint đợi RCP (by-id) rồi start; network_mode: host.

services:
  otbr:
    container_name: dashboard-thread-otbr
    build:
      context: ./otbr
      dockerfile: Dockerfile
    image: dashboard-thread-otbr
    network_mode: host
    cap_add:
      - NET_ADMIN
    device_cgroup_rules:
      - 'c 166:* rwm'
      - 'c 188:* rwm'
    volumes:
      - /dev:/dev
      - otbr-data:/var/lib/otbr
      - /run/dbus-otbr:/run/dbus-otbr  # socket của container expose ra host
    environment:
      - OT_RCP_DEVICE=spinel+hdlc+uart:///dev/serial/by-id/usb-1a86_USB_Single_Serial_579B026391-if00?uart-baudrate=460800
      - OT_INFRA_IF=enp8s0
      - OT_THREAD_IF=wpan0
      - OT_LOG_LEVEL=7
      # Dùng system bus của host (socket mount ở trên)
      # - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
    restart: unless-stopped

volumes:
  otbr-data:
